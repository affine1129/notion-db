name: Lint

on:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ruff check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check"

      - name: ruff format --check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --check"
