[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notion-db"
version = "0.1.0"
description = "A Python wrapper that makes working with Notion databases simple: schema-aware CRUD and queries with no model classes to declare."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "affine1129" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/notion_db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
